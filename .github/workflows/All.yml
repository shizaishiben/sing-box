          cache-dependency-path: |
            sing-box-for-desktop/pnpm-lock.yaml
            sing-box-for-desktop/dashboard/pnpm-lock.yaml
      - name: Enable full desktop core build tags
        shell: bash
        run: |
          set -euo pipefail
          for file in sing-box/release/DEFAULT_BUILD_TAGS*; do
            tags=$(cat "$file")
            printf '%s,%s\n' "$tags" "$EXTRA_BUILD_TAGS" > "$file"
          done

      - name: Set tag
        shell: pwsh
        working-directory: sing-box
        run: |-
          git ls-remote --exit-code --tags origin v${{ github.event.inputs.version }}
          if ($LASTEXITCODE -ne 0) {
            "PUBLISHED=false" >> $env:GITHUB_ENV
          }
          git tag v${{ github.event.inputs.version }} -f
      - name: Update version
        working-directory: sing-box
        if: github.event_name == 'workflow_dispatch'
        run: |-
          go run -v ./cmd/internal/update_desktop_version --nightly
      - name: Update nightly version
        working-directory: sing-box
        if: github.event_name != 'workflow_dispatch'
        run: |-
          go run -v ./cmd/internal/update_desktop_version --nightly

      - name: Setup signing
        run: |-
          $certificatePath = Join-Path $env:RUNNER_TEMP "windows-signing.p12"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATES_P12))
          @{
            windows = @{
              certificateFile = $certificatePath
              certificatePassword = $env:WINDOWS_P12_PASSWORD
            }
          } | ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8NoBOM sing-box-for-desktop/signing.local.json
        env:
          WINDOWS_CERTIFICATES_P12: ${{ secrets.WINDOWS_CERTIFICATES_P12 }}
          WINDOWS_P12_PASSWORD: ${{ secrets.WINDOWS_P12_PASSWORD }}

      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: all-electron-${{ runner.os }}-${{ matrix.desktop_arch }}-${{ hashFiles('sing-box-for-desktop/pnpm-lock.yaml') }}
          restore-keys: all-electron-${{ runner.os }}-${{ matrix.desktop_arch }}-

      - name: Install dependencies
        run: |-
          pnpm -C sing-box-for-desktop install --frozen-lockfile
      - name: Build
        run: pnpm -C sing-box-for-desktop package:win -- ${{ matrix.desktop_arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare upload
        run: |-
          $artifacts = @(Get-ChildItem sing-box-for-desktop/release/SFW-*.exe -File)
          if ($artifacts.Count -ne 1) {
            throw "expected one Windows installer for ${{ matrix.desktop_arch }}, found $($artifacts.Count)"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $artifacts[0].FullName dist
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: SFW-${{ github.event.inputs.version }}-${{ matrix.desktop_arch }}
          path: dist/SFW-*.exe
